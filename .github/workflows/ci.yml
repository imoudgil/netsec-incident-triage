name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python data/generate_telemetry.py
      - run: pytest tests -q
      - run: python run_pipeline.py

  powershell-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: PowerShell parse check
        shell: pwsh
        run: |
          $null = [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'scripts/Invoke-HostContainment.ps1'),
            [ref]$null,
            [ref]$errs
          )
          if ($errs.Count -gt 0) { throw ($errs | Out-String) }
          ./scripts/Invoke-HostContainment.ps1 -HostAddress 10.10.20.5 -WhatIf